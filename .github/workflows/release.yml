name: Build and Upload VSIX

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npx vsce package --no-dependencies

      - name: Get version and filename
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "filename=${NAME}-${VERSION}.vsix" >> $GITHUB_OUTPUT

      - name: Stage VSIX files for upload
        run: |
          mkdir -p ftp-upload
          NAME_BASE=$(node -p "require('./package.json').name")
          cp "${{ steps.meta.outputs.filename }}" ftp-upload/
          cp "${{ steps.meta.outputs.filename }}" "ftp-upload/${NAME_BASE}-latest.vsix"

      - name: Upload VSIX files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: "./ftp-upload/"
          server-dir: "releases/"
